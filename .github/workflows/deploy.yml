name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race a migration against each other.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Deploying a broken build is worse than not deploying, so the full suite
  # runs again here rather than trusting the PR run.
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finance
          POSTGRES_PASSWORD: finance
          POSTGRES_DB: finance_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U finance"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://finance:finance@localhost:5432/finance_test
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: API checks
        working-directory: apps/api
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy app tests
          uv run alembic upgrade head
          uv run pytest

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Web checks
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter web lint
          pnpm --filter web typecheck
          pnpm --filter web test
          pnpm --filter web build

  # Skipped until the VM exists. Without this guard every push to main fails
  # at the SSH step, which trains you to ignore a red CI badge — the one
  # signal that has to stay trustworthy. Setting the PRODUCTION_URL repo
  # variable is the last step of server setup, so it doubles as the switch
  # that turns real deploys on.
  deploy:
    needs: verify
    if: vars.PRODUCTION_URL != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check the deploy secrets are present
        run: |
          missing=""
          [ -z "${SSH_HOST}" ] && missing="${missing} DEPLOY_HOST"
          [ -z "${SSH_USER}" ] && missing="${missing} DEPLOY_USER"
          [ -z "${SSH_KEY}" ] && missing="${missing} DEPLOY_SSH_KEY"
          if [ -n "${missing}" ]; then
            echo "::error::Missing repository secrets:${missing}"
            exit 1
          fi
        env:
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

      # Pinning the host key means a DNS hijack or a MITM cannot silently
      # receive the deploy. StrictHostKeyChecking=no would hand the session to
      # whoever answers on port 22.
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${KNOWN_HOSTS}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      # The build happens on the VM. Building arm64 here would mean QEMU
      # emulation, which turns the Next.js build into a tens-of-minutes job,
      # and shipping the result would need a registry to move an image onto
      # the same machine that could have built it directly.
      - name: Deploy
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=15 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'cd ~/finance-tracker && ./infra/scripts/deploy.sh'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          set -e
          # Normalise before use. A value pasted with a stray newline, a space,
          # or wrapped in quotes reaches curl as a malformed URL, and curl
          # reports that as a request failure — so a settings typo reads as
          # five connection errors and an unreachable site. Strip whitespace
          # and quotes, drop any trailing slash, then say what is being called.
          url="$(printf '%s' "${PRODUCTION_URL}" | tr -d '[:space:]\047\042' | sed 's#/*$##')"

          case "${url}" in
            https://*) ;;
            *)
              echo "::error::PRODUCTION_URL must be an https:// URL. Got: '${url}'"
              exit 1
              ;;
          esac

          echo "Checking ${url}/api/health"
          for attempt in 1 2 3 4 5; do
            if curl -fsS "${url}/api/health"; then
              echo "Web is healthy."
              exit 0
            fi
            echo "Attempt $attempt failed; retrying in 15s."
            sleep 15
          done
          echo "::error::Production healthcheck never passed."
          exit 1
